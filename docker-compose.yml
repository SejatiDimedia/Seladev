version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: seladev-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: examplepassword
      MONGO_INITDB_DATABASE: seladev
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7.2-alpine
    container_name: seladev-redis
    restart: unless-stopped
    command: redis-server --requirepass exampleredispassword
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  mongo-data:
    driver: local
  redis-data:
    driver: local
